<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Pixel Library</title>
  </head>
  <body>
<!-- Header -->

<header>
  <nav class="flex items-center justify-between bg-gradient-to-r from-zinc-900 via-zinc-800 to-zinc-700 px-6 py-4">
    <a href="#" class="flex items-center gap-1 bg-gradient-to-r from-cyan-400 to-sky-600 bg-clip-text text-xl font-extrabold text-transparent sm:text-2xl">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="20 10 60 75" class="h-10 w-10 flex-shrink-0 fill-current sm:h-12 sm:w-12">
        <!-- Triángulo superior izquierdo (Cian brillante) -->

        <polygon points="20,25 50,10 50,45" class="text-[#32E6E2]" />

        <!-- Triángulo superior derecho / Curva de la P (Cian medio) -->

        <polygon points="50,10 80,25 50,45" class="text-[#24C1E0]" />

        <!-- Triángulo central / Cuerpo de la P (Azul turquesa oscuro) -->

        <polygon points="20,25 50,45 50,65" class="text-[#158ca7]" />

        <!-- Triángulo inferior / Pata de la P (Azul marino profundo) -->

        <polygon points="20,25 20,85 50,65" class="text-[#0E5A70]" />
      </svg>

      <!-- Brand name -->

      <span class=""> Pixel Library</span>
    </a>

    <!-- Botones // Buttons ( hidden due to is mobile first hide the button sm:block enable the button when viewport is ≥640px )-->

    <div class="flex items-center">
      <a href="#" class="hidden rounded-lg border border-zinc-600 px-2.5 py-1 font-bold text-white transition-colors hover:bg-zinc-800 sm:block sm:px-4 sm:py-1.5">Login</a>

      <a href="#">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" class="h-8 w-8 stroke-gray-400 stroke-3 sm:hidden">
          <!-- Cabeza -->

          <circle cx="12" cy="7" r="4" />

          <!-- Hombros / Cuerpo -->

          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
        </svg>
      </a>
    </div>
  </nav>
</header>

  </body>
</html>
