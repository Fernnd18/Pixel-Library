<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../src/output.css" rel="stylesheet">
    <title>Pixel Library</title>
</head>

<body>
    <div class="flex min-h-screen flex-col">
        <!-- =================================== Header ================================================ -->

        <header class="sticky top-0 z-50">
            <nav class="flex items-center justify-between bg-zinc-900 px-6 py-4">
                <a href="../index.html"
                    class="flex items-center gap-1 bg-gradient-to-r from-cyan-400 to-sky-600 bg-clip-text text-xl font-extrabold text-transparent sm:text-2xl">
                    <!-- SVG and Brand name -->

                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="20 10 60 75"
                        class="h-10 w-10 flex-shrink-0 fill-current sm:h-12 sm:w-12">
                        <!-- Triángulo superior izquierdo (Cian brillante) -->

                        <polygon points="20,25 50,10 50,45" class="fill-[#32E6E2]" />

                        <!-- Triángulo superior derecho / Curva de la P (Cian medio) -->

                        <polygon points="50,10 80,25 50,45" class="fill-[#24C1E0]" />

                        <!-- Triángulo central / Cuerpo de la P (Azul turquesa oscuro) -->

                        <polygon points="20,25 50,45 50,65" class="fill-[#158ca7]" />

                        <!-- Triángulo inferior / Pata de la P (Azul marino profundo) -->

                        <polygon points="20,25 20,85 50,65" class="fill-[#0E5A70]" />
                    </svg>

                    <!-- Brand name -->

                    <span class=""> Pixel Library</span>
                </a>

                <!-- Contenedor de los botones -->

                <!-- To be build 



      <div class="flex items-center"></div> 



      -->
            </nav>
        </header>

        <!-- =================================== Header ================================================ -->

        <!-- =================================== Contenido Principal =================================== -->

        <main class="flex-grow px-6 py-16 text-center">
            <h1
                class="bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-4xl font-extrabold tracking-tight text-transparent">
                Pixel Lybrary</h1>
            <input type="search" placeholder="Search Components..."
                class="mx-auto mt-8 block w-full max-w-xl rounded-lg border-2 border-cyan-600 bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text px-4 py-2 text-transparent" />
        </main>

        <!-- =================================== Contenido Principal =================================== -->

        <!-- =================================== Footer ================================================ -->

        <footer class="bg-zinc-900 px-10 py-10 text-zinc-400">
            <div class="mx-auto max-w-xl text-center">
                <!-- Columna 1: Redes Sociales -->

                <div>
                    <h3 class="font-bold text-white">Pixel Library</h3>

                    <p class="mt-3 text-sm leading-relaxed">
                        Pixel Library es una pequeña biblioteca de componentes que te
                        ayudaran a diseñar tu pagina web con facilidad.
                    </p>
                </div>
            </div>

            <!-- =================================== Copyright =================================== -->

            <div class="mt-10 border-t border-zinc-700 pt-4 text-center">
                <p><small>&copy; 2026 Pixel Library.</small></p>
            </div>
        </footer>
    </div>
</body>

</html>
